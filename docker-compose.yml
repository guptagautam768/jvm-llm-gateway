# Local dependencies for jvm-llm-gateway.
# Redis, Postgres, and Ollama are started so later milestones can use them.
# Week 1 application code does not connect to them; chat is an OpenAI passthrough.
name: jvm-llm-gateway

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Redis Stack is required later for RediSearch vectors (ADR-0006).
  # Its modules are not Apache-2.0. Payloads are ephemeral: no volume, persistence off.
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    ports:
      - "6379:6379"
    environment:
      REDIS_ARGS: "--save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.40.13
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  gateway:
    build: .
    ports:
      - "8080:8080"
      # ADR-0010: management port is published on localhost only.
      - "127.0.0.1:8081:8081"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
    depends_on:
      - postgres
      - redis
      - ollama

volumes:
  postgres-data:
  ollama-data:
