# Local dependencies for jvm-llm-gateway.
# Chat auth, rate limits, budgets, the usage ledger, and the response cache use Postgres and Redis.
# Ollama is the local provider. Default routes still prefer OpenAI and Anthropic.
# For a run with no paid keys, use docker-compose.ollama.yml (see the README).
name: jvm-llm-gateway

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Redis Stack is the token bucket, the budget counters, and the exact/semantic cache (ADR-0006).
  # Its modules are not Apache-2.0. Payloads are ephemeral: no volume, persistence off.
  # allkeys-lru can evict rate-limit keys; the gateway also caps cache entries itself.
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    ports:
      - "6379:6379"
    environment:
      REDIS_ARGS: "--save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.40.13
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  gateway:
    build: .
    ports:
      - "8080:8080"
      # ADR-0010: management port is published on localhost only.
      - "127.0.0.1:8081:8081"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/gateway
      SPRING_R2DBC_USERNAME: gateway
      SPRING_R2DBC_PASSWORD: gateway
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gateway
      SPRING_DATASOURCE_USERNAME: gateway
      SPRING_DATASOURCE_PASSWORD: gateway
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/gateway
      SPRING_FLYWAY_USER: gateway
      SPRING_FLYWAY_PASSWORD: gateway
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      GATEWAY_BOOTSTRAP_TENANT_ID: ${GATEWAY_BOOTSTRAP_TENANT_ID:-local}
      GATEWAY_BOOTSTRAP_KEY_ID: ${GATEWAY_BOOTSTRAP_KEY_ID:-}
      GATEWAY_BOOTSTRAP_KEY_SECRET: ${GATEWAY_BOOTSTRAP_KEY_SECRET:-}
      GATEWAY_RATE_CAPACITY: ${GATEWAY_RATE_CAPACITY:-60}
      GATEWAY_RATE_REFILL_PER_SECOND: ${GATEWAY_RATE_REFILL_PER_SECOND:-1}
      GATEWAY_TOKEN_BUDGET: ${GATEWAY_TOKEN_BUDGET:-}
      GATEWAY_COST_BUDGET_MICROS: ${GATEWAY_COST_BUDGET_MICROS:-}
      GATEWAY_TOKENS_PER_MINUTE: ${GATEWAY_TOKENS_PER_MINUTE:-}
      GATEWAY_BUDGET_WINDOW: ${GATEWAY_BUDGET_WINDOW:-30d}
      OTEL_TRACES_EXPORT_ENABLED: ${OTEL_TRACES_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      GATEWAY_TRACING_SAMPLE_PROBABILITY: ${GATEWAY_TRACING_SAMPLE_PROBABILITY:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector:0.114.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gateway-dashboard.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/gateway-dashboard.json:/var/lib/grafana/dashboards/gateway-dashboard.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  ollama-data:
