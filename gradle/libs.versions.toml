[versions]
spring-boot = "3.5.16"
dependency-management = "1.1.7"
wiremock = "3.13.2"
blockhound = "1.0.17.RELEASE"
resilience4j = "2.3.0"

[libraries]
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
reactor-core = { module = "io.projectreactor:reactor-core" }
reactor-test = { module = "io.projectreactor:reactor-test" }
spring-webflux = { module = "org.springframework:spring-webflux" }
reactor-netty-http = { module = "io.projectreactor.netty:reactor-netty-http" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
blockhound-junit = { module = "io.projectreactor.tools:blockhound-junit-platform", version.ref = "blockhound" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
logback-classic = { module = "ch.qos.logback:logback-classic" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
resilience4j-timelimiter = { module = "io.github.resilience4j:resilience4j-timelimiter", version.ref = "resilience4j" }
resilience4j-reactor = { module = "io.github.resilience4j:resilience4j-reactor", version.ref = "resilience4j" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
