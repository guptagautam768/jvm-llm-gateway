server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: jvm-llm-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  codec:
    max-in-memory-size: 2MB
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  data:
    redis:
      repositories:
        enabled: false
    r2dbc:
      repositories:
        enabled: false

management:
  server:
    port: 8081
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      console: ecs

gateway:
  # Model names below are illustrative (ADR-0005). An alias uses its timeout and
  # retry and walks every target. A concrete model name calls that provider only,
  # with gateway.resilience as the deadline and retry.
  resilience:
    timeout: 30s
    retry:
      max-attempts: 2
      backoff: 200ms
      multiplier: 2
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 10
      wait-duration-in-open-state: 30s
      permitted-number-of-calls-in-half-open-state: 3
  routes:
    fast:
      targets:
        - provider: openai
          model: gpt-4o-mini
        - provider: anthropic
          model: claude-haiku-4-5
      timeout: 30s
      retry:
        max-attempts: 2
        backoff: 200ms
        multiplier: 2
    smart:
      targets:
        - provider: openai
          model: gpt-4o
        - provider: anthropic
          model: claude-sonnet-4-5
      timeout: 60s
      retry:
        max-attempts: 2
        backoff: 200ms
        multiplier: 2
  providers:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      completions-path: /v1/chat/completions
      models-path: /v1/models
      connect-timeout: 5s
      response-timeout: 60s
      max-in-memory-bytes: 2097152
    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      messages-path: /v1/messages
      version: "2023-06-01"
      connect-timeout: 5s
      response-timeout: 120s
      default-max-tokens: 4096
      max-in-memory-bytes: 2097152
  # Caller keys are bootstrapped from the environment and stored as SHA-256 (ADR-0007).
  # Leave the secret empty to start without a key. Postgres and Redis are required while
  # tenancy is enabled: SPRING_R2DBC_URL, SPRING_DATASOURCE_URL, SPRING_DATA_REDIS_HOST.
  tenancy:
    enabled: true
    cache-ttl: 30s
    default-completion-tokens: 256
    metrics-tenant-tag: false
    bootstrap:
      - tenant-id: ${GATEWAY_BOOTSTRAP_TENANT_ID:local}
        display-name: ${GATEWAY_BOOTSTRAP_TENANT_NAME:Local}
        status: ${GATEWAY_BOOTSTRAP_TENANT_STATUS:active}
        keys:
          - key-id: ${GATEWAY_BOOTSTRAP_KEY_ID:}
            secret: ${GATEWAY_BOOTSTRAP_KEY_SECRET:}
        limits:
          rate-capacity: ${GATEWAY_RATE_CAPACITY:60}
          rate-refill-per-second: ${GATEWAY_RATE_REFILL_PER_SECOND:1}
          tokens-per-minute: ${GATEWAY_TOKENS_PER_MINUTE:}
          token-budget: ${GATEWAY_TOKEN_BUDGET:}
          cost-budget-micros: ${GATEWAY_COST_BUDGET_MICROS:}
          budget-window: ${GATEWAY_BUDGET_WINDOW:30d}
  ledger:
    retention: ${GATEWAY_LEDGER_RETENTION:30d}
    precreate-days: 7
    buffer-size: 1024
    retention-cron: "0 15 * * * *"
  # USD per 1K tokens. A model that is missing here is metered with a null cost (FR-071).
  prices:
    gpt-4o-mini:
      prompt-per-1k-usd: "0.00015"
      completion-per-1k-usd: "0.00060"
    gpt-4o:
      prompt-per-1k-usd: "0.00250"
      completion-per-1k-usd: "0.01000"
    claude-haiku-4-5:
      prompt-per-1k-usd: "0.00100"
      completion-per-1k-usd: "0.00500"
    claude-sonnet-4-5:
      prompt-per-1k-usd: "0.00300"
      completion-per-1k-usd: "0.01500"

info:
  app:
    name: jvm-llm-gateway
    description: OpenAI-compatible LLM gateway
    version: 0.1.0-SNAPSHOT
