# Scripted demo. WireMock stands in for Ollama so the script does not download a model.
# scripts/demo.sh is the entry point. It generates a caller key and passes it in the environment.
services:
  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8089:8080"
    volumes:
      - ./ops/demo/wiremock:/home/wiremock:ro

  gateway:
    environment:
      SPRING_PROFILES_ACTIVE: demo
      OLLAMA_BASE_URL: http://wiremock:8080
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GATEWAY_RATE_CAPACITY: ${GATEWAY_RATE_CAPACITY:-8}
      GATEWAY_RATE_REFILL_PER_SECOND: ${GATEWAY_RATE_REFILL_PER_SECOND:-0.001}
    depends_on:
      wiremock:
        condition: service_started
